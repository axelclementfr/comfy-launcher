[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Tailscale (optional, exits cleanly if AUTHKEY not set)
[program:tailscale]
command=/opt/launcher/scripts/start_tailscale.sh
autostart=true
autorestart=false
priority=1
stdout_logfile=/var/log/tailscale/start.log
stderr_logfile=/var/log/tailscale/start.err

# Boot script (one-shot, downloads models)
[program:boot]
command=python3 -u -m launcher.boot
directory=/opt/launcher
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=5
stdout_logfile=/var/log/launcher/boot.log
stderr_logfile=/var/log/launcher/boot.err

# ComfyUI - waits for boot sentinel before starting
[program:comfyui]
command=/bin/bash -c 'i=0; while [ ! -f /var/run/launcher_boot_done ] && [ $i -lt 300 ]; do sleep 2; i=$((i+1)); done; cd /workspace/ComfyUI && python3 main.py --listen 127.0.0.1 --port 18188'
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/comfyui.log
stderr_logfile=/var/log/comfyui.err

# Agent - same wait pattern
[program:agent]
command=/bin/bash -c 'i=0; while [ ! -f /var/run/launcher_boot_done ] && [ $i -lt 300 ]; do sleep 2; i=$((i+1)); done; uvicorn launcher.agent.app:app --host 127.0.0.1 --port 7878'
directory=/opt/launcher
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/agent.log
stderr_logfile=/var/log/agent.err

# Caddy reverse proxy + auth
[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/caddy.log
stderr_logfile=/var/log/caddy.err
